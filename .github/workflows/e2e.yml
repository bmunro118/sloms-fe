name: E2E

# End-to-end Playwright tests for the SLOMS web app. Runs every spec under
# frontend/e2e/tests against a real, seeded backend — drop a new *.spec.ts in
# there and it runs here automatically (currently: the 2FA enroll/verify flow).
#
# Self-contained — the Playwright config, global setup, fixtures and specs all
# live in this repo under frontend/e2e. It only needs:
#   1. Postgres (the `postgres` service below), and
#   2. the backend source (private repo Sonic-Labs-Ltd/sloms-be), checked out via
#      a read-only deploy key stored in secrets.BACKEND_DEPLOY_KEY. The matching
#      public key is registered as a read-only deploy key on sloms-be — scoped to
#      that one repo, rather than a broad personal-access token.
#
# The backend is booted with TWOFA_ENFORCE=true so login exercises the real
# enrollment / challenge flow; global-setup provisions a fresh user via the API
# (bootstrapping admin through the seeded trusted-device token).
#
# Note on pull_request: secrets are available to PRs raised from branches in this
# repo, but NOT to PRs from forks — those will fail the backend checkout. If you
# accept fork PRs, drop the pull_request trigger and keep this manual.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slomsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend runtime config (test-only secrets; no live integrations).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slomsdb
      JWT_SECRET: test-jwt-secret
      TOTP_ENC_KEY: test-totp-enc-key
      # The whole point of this suite — enforce 2FA so login routes through the
      # enrollment / challenge flow.
      TWOFA_ENFORCE: "true"
      # Frontend → backend wiring for the browser (Expo web in local/bearer mode).
      EXPO_PUBLIC_API_MODE: local
      EXPO_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout frontend (this repo)
        uses: actions/checkout@v4
        with:
          path: sloms-fe

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Sonic-Labs-Ltd/sloms-be
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: sloms-be

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Backend: install, migrate, seed, boot ────────────────────────────────
      - name: Install backend dependencies
        working-directory: sloms-be/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: sloms-be/backend
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Apply migrations
        working-directory: sloms-be/backend
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: sloms-be/backend
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/seed.sql

      - name: Install backend Playwright (PDF generation on boot)
        working-directory: sloms-be/backend
        run: npx playwright install --with-deps chromium

      - name: Build & start backend
        working-directory: sloms-be/backend
        run: |
          npx nest build
          node dist/src/main.js &
          # Ready when the API answers an HTTP request at all (login returns 400/401
          # for an empty body — both mean "server is up").
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              http://localhost:3000/api/auth/login || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "Backend up (HTTP $code) after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time" >&2; exit 1

      # ── Frontend: run the Playwright suite (auto-starts Expo web on 8081) ─────
      - name: Install frontend dependencies
        working-directory: sloms-fe/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: sloms-fe/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: sloms-fe/frontend
        run: npm run test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            sloms-fe/frontend/e2e/reports/
            sloms-fe/frontend/test-results/
          retention-days: 7
