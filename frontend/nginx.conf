server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health probe target for the Container App.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Per-environment runtime config — must never be cached (regenerated on each
    # container start with the current API_BASE_URL).
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        default_type application/javascript;
        try_files $uri =404;
    }

    # Hashed static assets — safe to cache aggressively.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any unmatched client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
